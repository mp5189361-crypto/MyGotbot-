<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Gotbot</title> <style> body { font-family: sans-serif; margin: 0; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; } .content { flex: 1; display: none; padding: 20px; text-align: center; } .active { display: block; } .nav-bar { display: flex; justify-content: space-around; background: #1e1e1e; padding: 10px 0; border-top: 1px solid #333; } .tab-btn { background: none; border: none; color: #aaa; font-size: 14px; cursor: pointer; } .tab-btn.active { color: #00e676; font-weight: bold; } .stats { font-size: 24px; margin: 20px 0; } .btn { background: #00e676; border: none; padding: 15px 30px; font-weight: bold; } </style> </head> <body> <div id="mine" class="content active"> <h1>Mining</h1> <div class="stats">Balance: <span id="balance">0.00</span> LMTR</div> <button class="btn" onclick="startMining()">Start Mining</button> </div> <div id="market" class="content"> <h1>Market</h1> <p>Upgrade your mining gear here.</p> </div> <div id="menu" class="content"> <h1>Menu</h1> <p>Tasks, Staking, and Chests.</p> </div> <div id="friends" class="content"> <h1>Friends</h1> <p>Invite friends and earn rewards.</p> </div> <div id="wallet" class="content"> <h1>Wallet</h1> <p>Connect TON wallet to verify.</p> </div> <div class="nav-bar"> <button class="tab-btn active" onclick="switchTab('mine')">Mine</button> <button class="tab-btn" onclick="switchTab('flask')">Market</button> <button class="tab-btn" onclick="switchTab('menu')">Menu</button> <button class="tab-btn" onclick="switchTab('friends')">Friends</button> <button class="tab-btn" onclick="switchTab('wallet')">Wallet</button> </div> <script> let balance = 0.00; function switchTab(tabId) { document.querySelectorAll('.content').forEach(el => el.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active')); document.getElementById(tabId).classList.add('active'); event.currentTarget.classList.add('active'); } function startMining() { setInterval(() => { balance += 0.01; document.getElementById('balance').innerText = balance.toFixed(2); }, 1000); } </script> </body> </html>
